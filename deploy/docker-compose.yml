# 本地/生产通用基础设施编排
# 用法：在仓库根目录执行 docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: wmc

services:
  postgres:
    image: postgres:18-alpine
    container_name: wmc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wmc_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-wmc}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wmc} -d ${POSTGRES_DB:-wmc}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wmc-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: wmc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wmcminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wmcminio123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wmc-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-wmc}:${POSTGRES_PASSWORD:-wmc_local_password}@postgres:5432/${POSTGRES_DB:-wmc}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORE: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-please-change-0123456789}
      PHONE_HASH_SECRET: ${PHONE_HASH_SECRET:-dev-only-phone-hash-secret}
      PHONE_ENC_KEY: ${PHONE_ENC_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_MOCK_CODE: ${SMS_MOCK_CODE:-123456}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-wmc-photos}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-wmcminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-wmcminio123}
      S3_USE_SSL: "false"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      ADMIN_DEV_LOGIN_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: wmc-caddy
    depends_on: [backend]
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
